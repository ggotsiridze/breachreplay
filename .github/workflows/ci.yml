name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, format, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . ../scripts
      - run: ruff format --check . ../scripts
      - run: pytest -q

  frontend:
    name: Frontend (typecheck, tests, build, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  integration:
    name: Integration (Docker, real Zeek + Suricata pipeline, verify)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q && docker compose -f docker-compose.showcase.yml config -q
      - run: docker compose build
      - name: make demo (real analyzers)
        run: ./scripts/demo.sh
      - name: Analyzer services reachable on the internal network
        run: |
          docker compose exec -T backend python -c "import urllib.request; print(urllib.request.urlopen('http://analyzer-zeek:8700/health').read().decode())"
          docker compose exec -T backend python -c "import urllib.request; print(urllib.request.urlopen('http://analyzer-suricata:8700/health').read().decode())"
      - name: Verify
        run: ./scripts/verify.sh
      - name: Showcase mode
        run: |
          docker compose down
          docker compose -f docker-compose.showcase.yml up -d --build --wait
          SHOWCASE=1 ./scripts/verify.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color; docker compose -f docker-compose.showcase.yml logs --no-color

  e2e:
    name: Playwright E2E (production stack)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start production-style stack
        run: ./scripts/demo.sh
      - run: npx playwright test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
